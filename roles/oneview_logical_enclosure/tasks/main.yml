- name: Update the Logical Enclosure configuration script(available only on C7000)
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: script_updated
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
      configurationScript: "# script (updated)"
  ignore_errors: "{{ ansible_check_mode }}"
  delegate_to: localhost
  when: oneview_logical_enclosure_contents.logical_enclosure.variant == "C7000"

- name: Generates a support dump for the Logical Enclosure
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: dumped
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
      dump:
        errorCode: MyDump16
        encrypt: "true"
        excludeApplianceDump: "false"
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: generated_dump_uri

- name: Reconfigure all enclosures associated with logical enclosure
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: reconfigured
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
  delegate_to: localhost

- name: Makes the logical enclosure consistent with the enclosure group
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: updated_from_group
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
  delegate_to: localhost

- name: Update the Logical Enclosure changing the name attribute
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
      newName: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }} (renamed)"
  delegate_to: localhost

- name: Rename the Logical Enclosure to its initial name
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }} (renamed)"
      newName: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
  delegate_to: localhost

