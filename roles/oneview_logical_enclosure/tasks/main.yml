---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_logical_enclosure_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_logical_enclosure_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_logical_enclosure_session

- name: Gather facts about all Enclosures
  oneview_enclosure_facts:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Gather facts about all Enclosure Groups
  oneview_enclosure_group_facts:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    name: "{{ oneview_logical_enclosure_contents.logical_enclosure.eg_name }}"
  delegate_to: localhost

# - name: Gather facts about all Firmware Drivers
#  oneview_firmware_driver_facts:
#    config: "{{ oneview_logical_enclosure_config }}"
#
# - debug: var=firmware_drivers

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures[0]['uri']
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures[1]['uri']
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures[2]['uri']

# This operation is only available on HPE Synergy
- name: Create a Logical Enclosure (available only on HPE Synergy)
  oneview_logical_enclosure:
    config: "{{ oneview_logical_enclosure_config }}"
    sessionID: "{{ oneview_logical_enclosure_session.ansible_facts.session }}"
    state: present
    data:
      enclosureUris:
        - /rest/enclosures/0000000000A66101
        - /rest/enclosures/0000000000A66102
        - /rest/enclosures/0000000000A66103
      enclosureGroupUri: "{{ enclosure_groups['uri'] }}"
      name: "{{ oneview_logical_enclosure_contents.logical_enclosure.logical_enclosure_name }}"
  ignore_errors: "{{ ansible_check_mode }}"
  delegate_to: localhost
  when: >-
    (contents.logical_enclosure.variant == "Synergy" and enclosures is not none
    and enclosures is not undefined and enclosure_groups is not none and
    enclosure_groups is not undefined)

