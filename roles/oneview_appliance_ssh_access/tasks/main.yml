---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_appliance_ssh_access_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_appliance_ssh_access_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_appliance_ssh_access_session

- name: Ensures the Appliance SSH Access is false
  oneview_appliance_ssh_access:
    config: "{{ oneview_appliance_ssh_access_config }}"
    sessionID: "{{ oneview_appliance_ssh_access_session.ansible_facts.session }}"
    state: present
    data:
      allowSshAccess: false
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_ssh_access

- name: Ensures the Appliance SSH Access is true
  oneview_appliance_ssh_access:
    config: "{{ oneview_appliance_ssh_access_config }}"
    sessionID: "{{ oneview_appliance_ssh_access_session.ansible_facts.session }}"
    state: present
    data:
      allowSshAccess: true
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_ssh_access

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_appliance_ssh_access_config }}"
    sessionID: "{{ oneview_appliance_ssh_access_session.ansible_facts.session }}"
  delegate_to: localhost
