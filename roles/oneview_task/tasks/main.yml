---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_task_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_task_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_task_session

- name: Gather facts about the last 5 running tasks
  oneview_task_facts:
    config: "{{ oneview_task_config }}"
    sessionID: "{{ oneview_task_session.ansible_facts.session }}"
    params:
      count: 5
      view: tree
      filter: [taskState='Running', isCancellable=true]
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: tasks

- name: Sets the state of task to 'Cancelling'
  oneview_task:
    config: "{{ oneview_task_config }}"
    sessionID: "{{ oneview_task_session.ansible_facts.session }}"
    data:
      name: "{{ tasks[0]['name'] }}"
      uri: "{{ tasks[0]['uri'] }}"
  delegate_to: localhost
  when: oneview_task_config_file.api_version >= 1200 and ( tasks | length > 0 )

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_task_config }}"
    sessionID: "{{ oneview_task_session.ansible_facts.session }}"
  delegate_to: localhost
