---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_appliance_network_interfaces_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_appliance_network_interfaces_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_appliance_network_interfaces_session

- name: Creates Network Interface if doesn't exist
  oneview_appliance_network_interfaces:
    config: "{{ oneview_appliance_network_interfaces_config }}"
    sessionID: "{{ oneview_appliance_network_interfaces_session.ansible_facts.session }}"
    state: present
    data:
      macAddress: "{{ oneview_appliance_network_interfaces_mac_address }}"
      ipv4Type: STATIC
      ipv6Type: UNCONFIGURE
      hostname: "{{ oneview_appliance_network_interfaces_hostname }}"
      app1Ipv4Addr: "{{ oneview_appliance_network_interfaces_app1_ipv4_address }}"
      app2Ipv4Addr: "{{ oneview_appliance_network_interfaces_app2_ipv4_address }}"
      virtIpv4Addr: "{{ oneview_appliance_network_interfaces_ipv4_address }}"
      ipv4Subnet: "{{ oneview_appliance_network_interfaces_ipv4_subnet }}"
      ipv4Gateway: "{{ oneview_appliance_network_interfaces_gateway }}"
      ipv4NameServers:
        - "{{ oneview_appliance_network_interfaces_dns_server_1 }}"
        - "{{ oneview_appliance_network_interfaces_dns_server_2 }}"
        - "{{ oneview_appliance_network_interfaces_dns_server_3 }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_network_interfaces

- name: Do nothing when network interface exists
  oneview_appliance_network_interfaces:
    config: "{{ oneview_appliance_network_interfaces_config }}"
    sessionID: "{{ oneview_appliance_network_interfaces_session.ansible_facts.session }}"
    state: present
    data:
      macAddress: "{{ oneview_appliance_network_interfaces_mac_address }}"
      ipv4Type: STATIC
      ipv6Type: UNCONFIGURE
      hostname: "{{ oneview_appliance_network_interfaces_hostname }}"
      app1Ipv4Addr: "{{ oneview_appliance_network_interfaces_app1_ipv4_address }}"
      app2Ipv4Addr: "{{ oneview_appliance_network_interfaces_app2_ipv4_address }}"
      virtIpv4Addr: "{{ oneview_appliance_network_interfaces_ipv4_address }}"
      ipv4Subnet: "{{ oneview_appliance_network_interfaces_ipv4_subnet }}"
      ipv4Gateway: "{{ oneview_appliance_network_interfaces_gateway }}"
      ipv4NameServers:
        - "{{ oneview_appliance_network_interfaces_dns_server_1 }}"
        - "{{ oneview_appliance_network_interfaces_dns_server_2 }}"
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_network_interfaces

- name: Updates dns servers of the network interface
  oneview_appliance_network_interfaces:
    config: "{{ oneview_appliance_network_interfaces_config }}"
    sessionID: "{{ oneview_appliance_network_interfaces_session.ansible_facts.session }}"
    state: present
    data:
      macAddress: "{{ oneview_appliance_network_interfaces_mac_address }}"
      ipv4NameServers:
        - "{{ oneview_appliance_network_interfaces_dns_server_1 }}"
        - "{{ oneview_appliance_network_interfaces_dns_server_3 }}"
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_network_interfaces

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_appliance_network_interfaces_config }}"
    sessionID: "{{ oneview_appliance_network_interfaces_session.ansible_facts.session }}"
  delegate_to: localhost
