---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_appliance_proxy_configuration_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_appliance_proxy_configuration_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_appliance_proxy_configuration_facts_session

- name: Gather facts about the Appliance Proxy
  oneview_appliance_proxy_configuration_facts:
    config: "{{ oneview_appliance_proxy_configuration_facts_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_proxy_configuration

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_appliance_proxy_configuration_facts_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_facts_session.ansible_facts.session }}"
  delegate_to: localhost
