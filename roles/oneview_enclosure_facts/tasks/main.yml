---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_enclosure_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_enclosure_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_facts_session

- name: Get currentVersion from URL
  oneview_version_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost
  when: oneview_enclosure_facts_config_file.api_version == ""
  register: oneview_enclosure_facts_version

- name: Print currentVersion if an apiVersion is not specified in config file
  ansible.builtin.set_fact:
    oneview_enclosure_facts_current_version: "{{ oneview_enclosure_facts_version.ansible_facts.version.currentVersion | int }}"
  when: oneview_enclosure_facts_config_file.api_version == ""

- name: Print currentVersion if an apiVersion is specified in config file
  ansible.builtin.set_fact:
    oneview_enclosure_facts_current_version: oneview_enclosure_facts_config_file.api_version | string
  when: oneview_enclosure_facts_config_file.api_version != ""

- name: Gather facts about all Enclosures
  oneview_enclosure_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures

- name: Gather paginated, filtered and sorted facts about Enclosures
  oneview_enclosure_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
    params:
      start: 0
      count: 3
      sort: name:descending
      filter: status=OK

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures

- name: Gather facts about an Enclosure by name
  oneview_enclosure_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
    name: "{{ oneview_enclosure_facts_contents.enclosure.enclosure_name }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosures

# This block is compatible with C7000 Enclosures
- name: Gather facts about an Enclosure by name with script
  oneview_enclosure_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
    name: "{{ oneview_enclosure_facts_contents.enclosure.enclosure_name }}"
    options:
      - script
  when: oneview_enclosure_facts_contents.enclosure.variant == 'C7000' or currentVersion == '300'
  delegate_to: localhost

- name: Gather facts about an Enclosure by name with options
  oneview_enclosure_facts:
    config: "{{ oneview_enclosure_facts_config }}"
    name: "{{ oneview_enclosure_facts_contents.enclosure.enclosure_name }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
    options:
      - environmentalConfiguration # optional
      - utilization: # optional
          fields: AmbientTemperature
          filter:
            - startDate=2016-07-01T14:29:42.000Z
            - endDate=2017-07-01T03:29:42.000Z
          view: day
          refresh: false
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_script
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_environmental_configuration
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_utilization

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_enclosure_facts_config }}"
    sessionID: "{{ oneview_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost
