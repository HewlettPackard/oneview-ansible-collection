---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_sas_logical_jbod_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_sas_logical_jbod_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_session

- name: Gather facts about all Drive Enclosures
  oneview_drive_enclosure_facts:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: drive_enclosures[0]['name']
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: drive_enclosures[1]['name']
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: drive_enclosures[2]['name']

- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_logical_jbod_drive_enclosure_uri_list: ["{{ drive_enclosures[0]['uri'] }}"]
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_logical_jbod_drive_bay_uris: ["{{ drive_enclosures[1]['driveBays'][2]['uri'] }}", "{{ drive_enclosures[1]['driveBays'][3]['uri'] }}"]
- name: Create a SAS Logical JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}"
      description: Sas logical Jbod description
      minSizeGB: 200
      maxSizeGB: 600
      numPhysicalDrives: 1
      driveTechnology:
        deviceInterface: SAS
        driveMedia: HDD
      driveEnclosureUris: "{{ oneview_sas_logical_jbod_drive_enclosure_uri_list }}"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Create a SAS logical JBOD by providing specific drive bay URIs
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-1"
      description: Sas logical Jbod description
      eraseData: true
      driveBayUris: "{{ oneview_sas_logical_jbod_drive_bay_uris }}"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Do nothing when JBOD already exists
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-1"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Change name of an existing JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: change_name
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}"
      newName: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Do nothing when name is already the same
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: change_name
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
      newName: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Change description of an existing JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: change_description
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
      newDescription: New Description to JBOD
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Do nothing when description is already the same
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: change_description
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
      newDescription: New Description to JBOD
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Disable drive sanitize option of an existing JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: erase_data
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Do nothing when drive sanitize option is already disabled
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: erase_data
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Clear metadata of an existing JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: clear_metadata
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Delete an existing JBOD
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: absent
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Do nothing if JBOD is already deleted
  oneview_sas_logical_jbod:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
    state: absent
    data:
      name: "{{ oneview_sas_logical_jbod_contents.sas_logical_jbod.sas_logical_jbod_name }}-renamed"
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_logical_jbod_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_logical_jbod_result.msg
  when: oneview_sas_logical_jbod_contents.sas_logical_jbod.variant == 'Synergy'

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_sas_logical_jbod_config }}"
    sessionID: "{{ oneview_sas_logical_jbod_session.ansible_facts.session }}"
  delegate_to: localhost
