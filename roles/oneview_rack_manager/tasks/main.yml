---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_rack_manager_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_rack_manager_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_rack_manager_session

- name: Add a Rack Manager
  oneview_rack_manager:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
    state: present
    data:
      hostname: "{{ oneview_rack_manager_contents.rack_manager.rack_manager_hostname }}"
      username: "{{ oneview_rack_manager_contents.rack_manager.rack_manager_username }}"
      password: "{{ oneview_rack_manager_contents.rack_manager.rack_manager_password }}"
      force: false
  delegate_to: localhost

- name: Gather facts about all Rack Managers
  oneview_rack_manager_facts:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: rack_managers
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_rack_manager_rack_manager_name: "{{ rack_managers[0]['name'] }}"

- name: Do nothing when the rack manager is already present
  oneview_rack_manager:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
    state: present
    data:
      hostname: "{{ oneview_rack_manager_rack_manager_name }}"
      username: "{{ oneview_rack_manager_contents.rack_manager.rack_manager_username }}"
      password: "{{ oneview_rack_manager_contents.rack_manager.rack_manager_password }}"
      force: false
  delegate_to: localhost

- name: Refresh the rack manager
  oneview_rack_manager:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
    state: refresh_state_set
    data:
      name: "{{ oneview_rack_manager_rack_manager_name }}"
  delegate_to: localhost

- name: Remove the rack manager by its name
  oneview_rack_manager:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
    state: absent
    data:
      name: "{{ oneview_rack_manager_rack_manager_name }}"
  delegate_to: localhost

- name: Do nothing when the rack manager is already removed
  oneview_rack_manager:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
    state: absent
    data:
      name: "{{ oneview_rack_manager_rack_manager_name }}"
  delegate_to: localhost

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_rack_manager_config }}"
    sessionID: "{{ oneview_rack_manager_session.ansible_facts.session }}"
  delegate_to: localhost
