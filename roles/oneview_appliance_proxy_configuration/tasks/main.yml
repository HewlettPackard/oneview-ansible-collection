---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_appliance_proxy_configuration_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_appliance_proxy_configuration_session

- name: Creates Proxy with HTTP protocol
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: present
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
      port: 8080
      username: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.username }}"
      password: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.password }}"
      communicationProtocol: HTTP
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_proxy_configuration

- name: Do nothing when proxy already exists
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: present
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
      port: 8080
      username: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.username }}"
      password: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.password }}"
      communicationProtocol: HTTP
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_proxy_configuration

- name: Creates proxy with updated username
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: present
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
      port: 8080
      username: testuser
      password: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.password }}"
      communicationProtocol: HTTP
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_proxy_configuration

- name: Deletes the configured proxy
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: absent
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
  delegate_to: localhost

- name: Do nothing when proxy already absent
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: absent
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
  delegate_to: localhost

- name: Re-creates Proxy for automation
  oneview_appliance_proxy_configuration:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
    state: present
    data:
      server: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.server_ip }}"
      port: 443
      username: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.username }}"
      password: "{{ oneview_appliance_proxy_configuration_contents.appliance_proxy.password }}"
      communicationProtocol: HTTP
  delegate_to: localhost

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_appliance_proxy_configuration_config }}"
    sessionID: "{{ oneview_appliance_proxy_configuration_session.ansible_facts.session }}"
  delegate_to: localhost
