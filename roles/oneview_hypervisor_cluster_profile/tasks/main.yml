---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_hypervisor_cluster_profile_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_hypervisor_cluster_profile_session

- name: Gather facts about server profile templates
  oneview_server_profile_template_facts:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.server_profile_template_name }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: server_profile_templates
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_hypervisor_cluster_profile_spt_uri: "{{ server_profile_templates[0]['uri'] }}"

- name: Gather facts about hypervisor managers
  oneview_hypervisor_manager_facts:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.hypervisor_manager_name }}"
  delegate_to: localhost
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_hypervisor_cluster_profile_hyp_mgr_uri: "{{ hypervisor_managers[0]['uri'] }}"

- name: Create a basic Hypervisor Cluster Profile
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.hypervisor_cluster_profile_name }}"
      hypervisorManagerUri: "{{ oneview_hypervisor_cluster_profile_hyp_mgr_uri }}"
      path: DC1
      hypervisorType: Vmware
      hypervisorHostProfileTemplate:
        serverProfileTemplateUri: "{{ oneview_hypervisor_cluster_profile_spt_uri }}"
        hostprefix: Test-cluster-host
        deploymentManagerType: UserManaged
  delegate_to: localhost
  register: oneview_hypervisor_cluster_profile_hyp_cp

# For creating virtual switch layout, enable that param and send the vswitch body under "hypervisorHostProfileTemplate:virtualSwitches"
- name: Create a Hypervisor Cluster Profile with vswitch
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: present
    params:
      create_vswitch_layout: true # If this is true, virtual switch layout will be created
    data:
      description: test cluster
      hypervisorType: Vmware
      hypervisorClusterSettings:
        type: Vmware
        drsEnabled: true
        haEnabled: false
        multiNicVMotion: false
        virtualSwitchType: Standard
      hypervisorHostProfileTemplate:
        serverProfileTemplateUri: "{{ oneview_hypervisor_cluster_profile_spt_uri }}"
        deploymentManagerType: UserManaged
        hostprefix: Test_cluster_profile_with_vswitch
        virtualSwitches: # this is the json body used to create vswitch
          serverProfileTemplateUri: "{{ oneview_hypervisor_cluster_profile_spt_uri }}"
          hypervisorManagerUri: "{{ oneview_hypervisor_cluster_profile_hyp_mgr_uri }}"
        hostConfigPolicy:
          leaveHostInMaintenance: false
          useHostnameToRegister: false
        virtualSwitchConfigPolicy:
          manageVirtualSwitches: true
          configurePortGroups: true
      name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.hypervisor_cluster_profile_name }}_with_vswitch"
      hypervisorManagerUri: "{{ oneview_hypervisor_cluster_profile_hyp_mgr_uri }}"
      path: DC1
  delegate_to: localhost
  register: oneview_hypervisor_cluster_profile_hyp_cp_vswitch

- name: Do nothing with the Hypervisor Cluster Profile when no changes are provided
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.hypervisor_cluster_profile_name }}"
      hypervisorManagerUri: "{{ oneview_hypervisor_cluster_profile_hyp_mgr_uri }}"
      path: DC1
      hypervisorType: Vmware
  delegate_to: localhost

- name: Update the Hypervisor Cluster Profile changing the attribute name
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: present
    data:
      name: "{{ oneview_hypervisor_cluster_profile_contents.hypervisor_cluster_profile.hypervisor_cluster_profile_name }}"
      newName: HCP-renamed
      hypervisorManagerUri: "{{ oneview_hypervisor_cluster_profile_hyp_mgr_uri }}"
      path: DC1
      hypervisorType: Vmware
  delegate_to: localhost
  register: oneview_hypervisor_cluster_profile_hyp_cp

- name: Delete the Hypervisor Cluster Profile
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: absent
    params:
      force: true
      soft_delete: false
    data:
      name: HCP-renamed
  delegate_to: localhost

#    - name: Delete the Hypervisor Cluster Profile with vswitch
#      oneview_hypervisor_cluster_profile:
#        config: "{{ oneview_hypervisor_cluster_profile_config }}"
#        state: absent
#        params:
#          force: False
#          soft_delete: False
#        data: "{{ oneview_hypervisor_cluster_profile_hyp_cp_vswitch.ansible_facts.hypervisor_cluster_profile }}"
#      delegate_to: localhost
#      register: deleted

- name: Do nothing when Hypervisor Cluster Profile is absent
  oneview_hypervisor_cluster_profile:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
    state: absent
    data:
      name: HCP-renamed
  delegate_to: localhost

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_hypervisor_cluster_profile_config }}"
    sessionID: "{{ oneview_hypervisor_cluster_profile_session.ansible_facts.session }}"
  delegate_to: localhost
