---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_server_hardware_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_server_hardware_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_server_hardware_session

- name: Gather facts about all Scopes
  oneview_scope_facts:
    config: "{{ oneview_server_hardware_config }}"
    sessionID: "{{ oneview_server_hardware_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Check for Firmware Compliance
  oneview_server_hardware:
    config: "{{ oneview_server_hardware_config }}"
    sessionID: "{{ oneview_server_hardware_session.ansible_facts.session }}"
    state: check_firmware_compliance
    data:
      firmwareComplianceData:
        firmwareBaselineId: "{{ oneview_server_hardware_contents.server_hardware.firmware_baseline_id }}"
        serverUUID: "{{ server_hardwares[0]['uuid'] }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: ansible_facts['server_hardware']['serverFirmwareUpdateRequired']

- name: Update Firmware of the server hardware
  oneview_server_hardware:
    config: "{{ oneview_server_hardware_config }}"
    sessionID: "{{ oneview_server_hardware_session.ansible_facts.session }}"
    state: firmware_update
    data:
      name: "{{ server_hardwares[0]['name'] }}"
      firmwareUpdateData:
        baselineUri: /rest/firmware-drivers/{{ oneview_server_hardware_contents.server_hardware.firmware_baseline_id }}
        forceApplyFirmware: "false"
        firmwareInstallType: FirmwareOnlyOfflineMode
        installationPolicy: LowerThanBaseline
  delegate_to: localhost
  when: ansible_facts['server_hardware']['serverFirmwareUpdateRequired'] | bool

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_server_hardware_config }}"
    sessionID: "{{ oneview_server_hardware_session.ansible_facts.session }}"
  delegate_to: localhost
