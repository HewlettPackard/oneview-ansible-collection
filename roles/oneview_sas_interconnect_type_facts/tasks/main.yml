---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_sas_interconnect_type_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_type_facts_session

- name: Gather facts about all SAS Interconnect Types
  oneview_sas_interconnect_type_facts:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    sessionID: "{{ oneview_sas_interconnect_type_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: sas_interconnect_types

- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_interconnect_type_facts_sas_interconnect_type_name: "{{ sas_interconnect_types[0]['name'] }}"
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_interconnect_type_facts_sas_interconnect_type_uri: "{{ sas_interconnect_types[0]['uri'] }}"

- name: Gather paginated, filtered and sorted facts about SAS Interconnect Types
  oneview_sas_interconnect_type_facts:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    sessionID: "{{ oneview_sas_interconnect_type_facts_session.ansible_facts.session }}"
    params:
      start: 0
      count: 3
      sort: name:descending
      filter: status=OK

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: sas_interconnect_types

- name: Gather facts about a SAS Interconnect Type by name
  oneview_sas_interconnect_type_facts:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    sessionID: "{{ oneview_sas_interconnect_type_facts_session.ansible_facts.session }}"
    name: "{{ oneview_sas_interconnect_type_facts_sas_interconnect_type_name }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: sas_interconnect_types

- name: Gather facts about a SAS Interconnect Type by uri
  oneview_sas_interconnect_type_facts:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    sessionID: "{{ oneview_sas_interconnect_type_facts_session.ansible_facts.session }}"
    uri: "{{ oneview_sas_interconnect_type_facts_sas_interconnect_type_uri }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: sas_interconnect_types

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_sas_interconnect_type_facts_config }}"
    sessionID: "{{ oneview_sas_interconnect_type_facts_session.ansible_facts.session }}"
  delegate_to: localhost
