---
# task for session_management
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_appliance_device_snmp_v3_users_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_appliance_device_snmp_v3_users_session

- name: Ensure that the SNMPv3 user is present using the default configuration
  oneview_appliance_device_snmp_v3_users:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    sessionID: "{{ oneview_appliance_device_snmp_v3_users_session.ansible_facts.session }}"
    state: present
    name: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
    data:
      type: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.type }}"
      userName: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
      securityLevel: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.security_level }}"
      authenticationProtocol: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.authentication_protocol }}"
      authenticationPassphrase: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.authentication_passphrase }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_device_snmp_v3_users

- name: Set the password of specified SNMPv3 user
  oneview_appliance_device_snmp_v3_users:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    sessionID: "{{ oneview_appliance_device_snmp_v3_users_session.ansible_facts.session }}"
    state: present
    name: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
    data:
      userName: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
      authenticationPassphrase: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.authentication_passphrase }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: appliance_device_snmp_v3_users

- name: Ensure that the SNMPv3 user is absent
  oneview_appliance_device_snmp_v3_users:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    sessionID: "{{ oneview_appliance_device_snmp_v3_users_session.ansible_facts.session }}"
    state: absent
    name: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
    data:
      userName: "{{ oneview_appliance_device_snmp_v3_users_contents.appliance_device_snmp_v3_users.user_name }}"
  delegate_to: localhost

- name: Creating the SNMPv3 user for automation
  oneview_appliance_device_snmp_v3_users:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    state: present
    name: user123456
    data:
      type: Users
      userName: user123456
  delegate_to: localhost

- name: Creating another SNMPv3 user for automation
  oneview_appliance_device_snmp_v3_users:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    sessionID: "{{ oneview_appliance_device_snmp_v3_users_session.ansible_facts.session }}"
    state: present
    name: test2
    data:
      type: Users
      userName: test2
  delegate_to: localhost

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_appliance_device_snmp_v3_users_config }}"
    sessionID: "{{ oneview_appliance_device_snmp_v3_users_session.ansible_facts.session }}"
  delegate_to: localhost
