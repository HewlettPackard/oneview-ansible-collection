---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_enclosure_group_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_enclosure_group_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_group_facts_session

- name: Gather facts about all Enclosure Groups
  oneview_enclosure_group_facts:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_groups

- name: Gather facts about all Scopes
  oneview_scope_facts:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Gather paginated, filtered and sorted facts about Enclosure Groups
  oneview_enclosure_group_facts:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
    params:
      start: 0
      count: 3
      sort: name:descending
      filter: status=OK
      scope_uris: "{{ scopes[0]['uri'] }}"
  delegate_to: localhost
  when: scopes is defined

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_groups

- name: Gather facts about an Enclosure Group by name
  oneview_enclosure_group_facts:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
    name: "{{ oneview_enclosure_group_facts_contents.enclosure_group.eg_name }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_groups

- name: Gather facts about an Enclosure Group by name with configuration script
  oneview_enclosure_group_facts:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
    name: "{{ oneview_enclosure_group_facts_contents.enclosure_group.eg_name }}"
    options:
      - configuration_script
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: enclosure_group_script

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_enclosure_group_facts_config }}"
    sessionID: "{{ oneview_enclosure_group_facts_session.ansible_facts.session }}"
  delegate_to: localhost
