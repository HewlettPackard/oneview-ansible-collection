---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_id_pools_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_id_pools_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_id_pools_session

- name: Enables or disables the pool type
  oneview_id_pools:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
    state: update_pool_type
    data:
      poolType: "{{ oneview_id_pools_contents.id_pools.poolType }}"
      enabled: true
  delegate_to: localhost

- name: Allocates one or more IDs from a pool
  oneview_id_pools:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
    state: allocate
    data:
      poolType: "{{ oneview_id_pools_contents.id_pools.poolType }}"
      count: 2
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: id_pool

- name: Collects one or more IDs to be returned to a pool
  oneview_id_pools:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
    state: collect
    data:
      poolType: "{{ oneview_id_pools_contents.id_pools.poolType }}"
      idList: '{{ id_pool["idList"] }}'
  delegate_to: localhost

- name: Generates a random range
  oneview_id_pools_facts:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
    state: generate
    data:
      poolType: "{{ oneview_id_pools_contents.id_pools.poolType }}"
  delegate_to: localhost
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: id_pool

- name: Validates a set of IDs to reserve in the pool
  oneview_id_pools:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
    state: validate
    data:
      poolType: "{{ oneview_id_pools_contents.id_pools.poolType }}"
      idList: ['{{ id_pool["startAddress"] }}', '{{ id_pool["endAddress"] }}']
  delegate_to: localhost

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_id_pools_config }}"
    sessionID: "{{ oneview_id_pools_session.ansible_facts.session }}"
  delegate_to: localhost
