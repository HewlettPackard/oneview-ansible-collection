---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_version_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_version_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_version_facts_session

- name: Gather facts about current and minimum Version
  oneview_version_facts:
    config: "{{ oneview_version_facts_config }}"
    sessionID: "{{ oneview_version_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: version

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_version_facts_config }}"
    sessionID: "{{ oneview_version_facts_session.ansible_facts.session }}"
  delegate_to: localhost
