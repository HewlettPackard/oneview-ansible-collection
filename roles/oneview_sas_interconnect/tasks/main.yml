---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_sas_interconnect_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_sas_interconnect_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_session

- name: Gather facts about all SAS Interconnects
  oneview_sas_interconnect_facts:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_interconnect_variant: Synergy
- name: Run ansible.builtin.set_fact
  ansible.builtin.set_fact:
    oneview_sas_interconnect_sas_interconnect_name: "{{ sas_interconnects[0]['name'] }}"
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_sas_interconnect_name

- name: Refresh the SAS interconnect
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: refreshed
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
      refreshState: RefreshPending
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Power Off the SAS interconnect
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: power_off
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Do nothing when SAS interconnect is already powered off
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: power_off
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Power On the SAS interconnect
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: power_on
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Do nothing when SAS interconnect is already powered on
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: power_on
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Set the UID state of the SAS interconnect to On
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: uid_on
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Do nothing when UID state is already set to On
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: uid_on
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Set the UID state of the SAS interconnect to Off
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: uid_off
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

- name: Do nothing when UID state is already set to Off
  oneview_sas_interconnect:
    config: "{{ oneview_sas_interconnect_config }}"
    sessionID: "{{ oneview_sas_interconnect_session.ansible_facts.session }}"
    state: uid_off
    data:
      name: "{{ oneview_sas_interconnect_sas_interconnect_name }}"
  when: oneview_sas_interconnect_variant == 'Synergy'
  delegate_to: localhost
  register: oneview_sas_interconnect_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_sas_interconnect_result.msg
  when: oneview_sas_interconnect_variant == 'Synergy'

