---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_logical_enclosure_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_logical_enclosure_facts_session

- name: Gather facts about all Logical Enclosures
  oneview_logical_enclosure_facts:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: logical_enclosures

- name: Gather facts about all Scopes
  oneview_scope_facts:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Gather paginated, filtered and sorted facts about Logical Enclosures
  oneview_logical_enclosure_facts:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
    params:
      start: 0
      count: 3
      sort: name:descending
      filter: status=OK
      scope_uris: "{{ scopes[0]['uri'] }}"

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: logical_enclosures

- name: Gather facts about a Logical Enclosure by name
  oneview_logical_enclosure_facts:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
    name: "{{ oneview_logical_enclosure_facts_contents.logical_enclosure.logical_enclosure_name }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: logical_enclosures

# This method is available for API version 300 in synergy and in all API versions in c7000
- name: Gather facts about a Logical Enclosure by name with options
  oneview_logical_enclosure_facts:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
    name: "{{ oneview_logical_enclosure_facts_contents.logical_enclosure.logical_enclosure_name }}"
    options:
      - script
  delegate_to: localhost
  when: oneview_logical_enclosure_facts_contents.logical_enclosure.variant == 'C7000'

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: logical_enclosures
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: logical_enclosure_script

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_logical_enclosure_facts_config }}"
    sessionID: "{{ oneview_logical_enclosure_facts_session.ansible_facts.session }}"
  delegate_to: localhost
