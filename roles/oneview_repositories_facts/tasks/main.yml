---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_repositories_facts_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_repositories_facts_session

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_repositories_facts_session

- name: Gather facts about all Repositories
  oneview_repositories_facts:
    config: "{{ oneview_repositories_facts_config }}"
    sessionID: "{{ oneview_repositories_facts_session.ansible_facts.session }}"
  delegate_to: localhost

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: repositories

- name: Gather paginated, filtered and sorted facts about Repositories
  oneview_repositories_facts:
    config: "{{ oneview_repositories_facts_config }}"
    sessionID: "{{ oneview_repositories_facts_session.ansible_facts.session }}"
    params:
      start: 0
      count: 3
      sort: name:descending

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: repositories

- name: Gather facts about a Repository by Id
  oneview_repositories_facts:
    config: "{{ oneview_repositories_facts_config }}"
    sessionID: "{{ oneview_repositories_facts_session.ansible_facts.session }}"
    name: "{{ repositories[0]['uuid'] }}"
  delegate_to: localhost
  when: repositories | default('', True)

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: repositories

- name: Gather facts about a Repository by name
  oneview_repositories_facts:
    config: "{{ oneview_repositories_facts_config }}"
    sessionID: "{{ oneview_repositories_facts_session.ansible_facts.session }}"
    name: "{{ repositories[0]['name'] }}"
  delegate_to: localhost
  when: repositories | default('', True)

- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: repositories

- name: Logout Session
  oneview_logout_session:
    config: "{{ oneview_repositories_facts_config }}"
    sessionID: "{{ oneview_repositories_facts_session.ansible_facts.session }}"
  delegate_to: localhost
