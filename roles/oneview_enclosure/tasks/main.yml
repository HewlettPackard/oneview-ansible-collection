# This state is only available on HPE Synergy.
- name: Set the active Synergy Frame Link Module on bay 2
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: manager_bays_role_active
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
