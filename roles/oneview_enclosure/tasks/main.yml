  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
- name: E-Fuse the appliance bay 1
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: appliance_bays_power_state_e_fuse
