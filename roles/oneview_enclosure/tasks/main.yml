---
- name: Fetch Session Id
  oneview_get_session_id:
    config: "{{ oneview_enclosure_config }}"
    name: Test_Session
  delegate_to: localhost
  register: oneview_enclosure_session
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_session
- name: Ensure the Enclosure framelink with ipv6 is present '{{ oneview_enclosure_contents.enclosure.enclosure_framelink_ipv6 }}'
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: present
    data:
      hostname: "{{ oneview_enclosure_contents.enclosure.enclosure_framelink_ipv6 }}"
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy' and contents.enclosure.enclosure_framelink_ipv6 is defined
  delegate_to: localhost

# Waiting for 10 seconds before attempting operations on enclosure
- name: Run ansible.builtin.wait_for
  ansible.builtin.wait_for:
    port: 22
    host: "{{ ansible_host }}"
    delay: 10
# connection: local

# Waiting for 10 seconds before attempting operations on enclosure
- name: Run ansible.builtin.wait_for
  ansible.builtin.wait_for:
    port: 22
    host: "{{ ansible_host }}"
    delay: 10
  connection: local

- name: Update the name of the enclosure to "Test-Enclosure-Renamed"
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: present
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      newName: Test-Enclosure-Renamed
  delegate_to: localhost

# Waiting for 10 seconds before attempting operations on enclosure
- name: Run ansible.builtin.wait_for
  ansible.builtin.wait_for:
    port: 22
    host: "{{ ansible_host }}"
    delay: 10
  connection: local

- name: Update the name of the rack to "Rack-Renamed" and rename the Enclosure again
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: present
    validate_etag: false
    data:
      name: Test-Enclosure-Renamed
      newName: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      rackName: Rack-Renamed
  delegate_to: localhost

- name: Reconfigure the enclosure
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: reconfigured
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
  delegate_to: localhost

- name: Refresh the enclosure along with all of its components
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: refreshed
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      refreshState: RefreshPending
  delegate_to: localhost

# Waiting for 10 seconds before attempting operations on enclosure
- name: Run ansible.builtin.wait_for.wait_for
  ansible.builtin.wait_for.wait_for:
    port: 22
    host: "{{ ansible_host }}"
    delay: 10
  connection: local

- name: Create certificate signing request for Synergy
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: create_certificate_request
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      type: "{{ oneview_enclosure_contents.enclosure.csr_data_type }}"
      organization: "{{ oneview_enclosure_contents.enclosure.organization }}"
      organizationalUnit: "{{ oneview_enclosure_contents.enclosure.organizationalUnit }}"
      locality: "{{ oneview_enclosure_contents.enclosure.locality }}"
      state: "{{ oneview_enclosure_contents.enclosure.state }}"
      country: "{{ oneview_enclosure_contents.enclosure.country }}"
      commonName: "{{ oneview_enclosure_contents.enclosure.commonName }}"
  delegate_to: localhost
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

- name: Get certificate signing request for Synergy
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: get_certificate_request
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
  delegate_to: localhost

# Waiting for 10 seconds before attempting operations on enclosure
- name: Run ansible.builtin.wait_for
  ansible.builtin.wait_for:
    port: 22
    host: "{{ ansible_host }}"
    delay: 10
  connection: local

- name: Import certificate signing request
  hpe.oneview.oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: import_certificate_request
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      type: "{{ oneview_enclosure_contents.enclosure.cert_data_type }}"
      base64Data: "{{ oneview_enclosure_contents.enclosure.base64Data }}"
  delegate_to: localhost
  ignore_errors: "{{ ansible_check_mode }}"

# This state is only available on HPE Synergy.
- name: Set the appliance bay power state on
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: appliance_bays_powered_on
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      bayNumber: 1
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_result.msg
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
- name: Set the appliance UID state off
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: uid_off
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_result.msg
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
- name: Set the appliance UID state on
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: uid_on
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_result.msg
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
- name: Set the UID for the Synergy Frame Link Module state on
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: manager_bays_uid_on
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      bayNumber: 1
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_result.msg
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
- name: Set the UID for the Synergy Frame Link Module state off
  oneview_enclosure:
    config: "{{ oneview_enclosure_config }}"
    sessionID: "{{ oneview_enclosure_session.ansible_facts.session }}"
    state: manager_bays_uid_off
    validate_etag: false
    data:
      name: "{{ oneview_enclosure_contents.enclosure.enclosure_name }}"
      bayNumber: 1
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
