  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'
  delegate_to: localhost
  ignore_errors: "{{ ansible_check_mode }}"
  register: oneview_enclosure_result
- name: Run ansible.builtin.debug
  ansible.builtin.debug:
    var: oneview_enclosure_result.msg
  when: oneview_enclosure_contents.enclosure.variant == 'Synergy'

# This state is only available on HPE Synergy.
